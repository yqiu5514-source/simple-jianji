
name: Build Simple Jianji Android APK

on:
  push:
    branches:
      - android-webview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp appearance-2-1.js www/appearance-2-1.js

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/simple-jianji-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' -print -quit)"

          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="android/app/build/outputs/apk/release/app-release.apk"
          fi

          test -f "$UNSIGNED_APK"

          zipalign -f -v 4 "$UNSIGNED_APK" "$RUNNER_TEMP/aligned.apk"

          apksigner sign \
            --ks "$KEYSTORE" \
            --ks-key-alias simple-jianji \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/simple-jianji-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

          apksigner verify --verbose --print-certs "$RUNNER_TEMP/simple-jianji-release.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-jianji-release-apk
          path: ${{ runner.temp }}/simple-jianji-release.apk
          if-no-files-found: error
          retention-days: 14
